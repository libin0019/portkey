[server]
request_timeout_seconds = 15

[storage]
sqlite_path = "./data/router.db"
media_ttl_seconds = 259200

[limits]
max_image_bytes = 10485760
max_file_bytes = 20971520
max_request_bytes = 25165824
max_concurrent_media_operations = 4

[dynamic_webhook]
enabled = true
base_url = "https://open.feishu.cn/open-apis/bot/v2/hook"
# webhook_secret = "${DYNAMIC_WEBHOOK_SECRET}"

