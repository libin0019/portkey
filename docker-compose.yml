name: ${COMPOSE_PROJECT_NAME:-wecom-feishu-router}

services:
  router:
    image: ${ROUTER_IMAGE:?请在 .env 中配置 ROUTER_IMAGE}
    pull_policy: always
    restart: unless-stopped
    init: true
    ports:
      - "${ROUTER_BIND_IP:-127.0.0.1}:${ROUTER_PORT:-8000}:8000"
    env_file:
      - .env
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      - router-data:/app/data
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 256
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen("http://127.0.0.1:8000/healthz", timeout=2)
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    stop_grace_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

volumes:
  router-data:
